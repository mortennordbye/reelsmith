<!-- reelsmith A: a red-hot play-button ingot on a steel anvil, sparks off the strike. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="reelsmith: glowing play-button ingot on an anvil">
  <title>reelsmith</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A212B"/>
      <stop offset="1" stop-color="#010409"/>
    </linearGradient>
    <radialGradient id="forge" cx="256" cy="250" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF7A1A" stop-opacity=".34"/>
      <stop offset="1" stop-color="#FF7A1A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".09"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".2"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="284" x2="0" y2="424" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C9D1D9"/>
      <stop offset=".22" stop-color="#8B949E"/>
      <stop offset=".6" stop-color="#484F58"/>
      <stop offset="1" stop-color="#21262D"/>
    </linearGradient>
    <linearGradient id="face" x1="96" y1="0" x2="420" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E6EDF3" stop-opacity=".2"/>
      <stop offset=".45" stop-color="#FFB45A" stop-opacity=".95"/>
      <stop offset="1" stop-color="#E6EDF3" stop-opacity=".35"/>
    </linearGradient>
    <radialGradient id="hot" cx="228" cy="178" r="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF8E1"/>
      <stop offset=".3" stop-color="#FFD166"/>
      <stop offset=".7" stop-color="#FF8A1F"/>
      <stop offset="1" stop-color="#D9370B"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect width="512" height="512" rx="112" fill="url(#forge)"/>
  <rect width="512" height="512" rx="112" fill="url(#sheen)"/>

  <g filter="url(#drop)">
    <path d="M88 288 Q140 286 172 280 L410 280 Q422 280 422 292 L422 316 Q422 328 410 328 L362 328 Q342 332 338 354 L338 372 L384 400 Q392 406 392 416 L392 428 L132 428 L132 416 Q132 406 140 400 L186 372 L186 354 Q182 334 158 328 Q114 318 88 288 Z" fill="url(#steel)"/>
  </g>
  <path d="M92 288 Q140 286 172 282 L412 282" fill="none" stroke="url(#face)" stroke-width="5" stroke-linecap="round"/>

  <path d="M188 92 L188 264 L338 178 Z" fill="#FF6A00" filter="url(#glow)" opacity=".85"/>
  <path d="M188 92 L188 264 L338 178 Z" fill="url(#hot)" stroke="url(#hot)" stroke-width="26" stroke-linejoin="round"/>

  <g stroke-linecap="round" fill="none">
    <path d="M360 150 L398 118" stroke="#FFD166" stroke-width="9"/>
    <path d="M372 190 L424 186" stroke="#FFB13B" stroke-width="8"/>
    <path d="M362 228 L402 256" stroke="#FF8A1F" stroke-width="7"/>
    <path d="M330 116 L346 82" stroke="#FFE7A3" stroke-width="6"/>
  </g>
  <g fill="#FFD166">
    <circle cx="420" cy="140" r="6"/>
    <circle cx="444" cy="218" r="5"/>
    <circle cx="372" cy="80" r="4"/>
    <circle cx="420" cy="276" r="4"/>
  </g>

  <rect x="1.5" y="1.5" width="509" height="509" rx="110.5" fill="none" stroke="url(#edge)" stroke-width="3"/>
</svg>
