[project]
name = "reelsmith"
version = "0.1.0"
description = "Automated Instagram Reels pipeline for trending AI/dev tooling"
requires-python = ">=3.14,<3.15"
dependencies = [
    "httpx>=0.28",            # GitHub + Hacker News APIs
    "pydantic>=2.9",          # data contracts between every pipeline stage
    "pydantic-settings>=2.6", # .env loading + validation
    "tenacity>=9.0",          # retry/backoff for API rate limits
    "edge-tts>=7.0",          # voiceover synthesis
    "faster-whisper>=1.1",    # word-level timestamps without PyTorch
    "playwright>=1.49",       # screenshots the GitHub page for the opening shot
    "kokoro-onnx>=0.4",       # default TTS: local, Apache-2.0, distinctive voices
    "soundfile>=0.12",        # writes Kokoro output
    "typer>=0.15",            # CLI
    "rich>=13.9",             # readable pipeline output
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",  # the pure-logic suite in tests/
    "pytest-asyncio>=0.24",  # the gateway is async end to end
    "ruff>=0.8",
]
# The DM gateway. A separate group because the container installs only this,
# and none of the pipeline's 350 MB of models and browsers belong in it.
gateway = [
    "fastapi>=0.115",
    # Not `[standard]`; see gateway/requirements.in for why the two extras that
    # matter are named instead.
    "uvicorn>=0.32",
    "uvloop>=0.21",
    "httptools>=0.6",
    "aiosqlite>=0.20",        # one file of state, no ORM
    "prometheus-client>=0.21",
    "python-multipart>=0.0.9", # the cover upload is multipart
    "jinja2>=3.1",            # the admin UI, server-rendered, no build step
    "tzdata>=2024.1",         # slim images ship no tz database; slots need one
]

[project.scripts]
reelsmith = "main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "sources", "gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The pipeline modules import as top-level names (`config`, `pipeline.spec`),
# so the repo root has to be importable without installing the package.
pythonpath = ["."]
addopts = "-q"
# The gateway suite is async throughout. Auto mode keeps the marker off every
# single test in it, and the pipeline suite is synchronous so nothing there
# changes.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
