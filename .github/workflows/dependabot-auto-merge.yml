# Turns Dependabot from a queue of chores into something that only speaks up
# when it needs a decision.
#
# What merges itself: every security update, at any semver level, and routine
# patch and minor bumps. What waits for a human: routine majors.
#
# The safety here is not in this file, it is in the ruleset on `main`. This
# workflow only asks GitHub to merge the PR *when its required checks pass*
# (`gh pr merge --auto`); it never merges anything directly. Remove the
# required CI check from the ruleset and every one of these merges instantly
# and unverified, so the two are a pair.
name: Dependabot auto-merge

on:
  # `pull_request_target` rather than `pull_request`, because a PR from
  # Dependabot's branch gets a read-only GITHUB_TOKEN and cannot enable
  # auto-merge on itself. This runs in the context of the base branch instead.
  #
  # The usual danger of pull_request_target is that it grants write scope to a
  # workflow that then checks out and runs untrusted PR code. This one never
  # checks the PR out. It reads metadata and calls the API, nothing else, and
  # the actor guard below means it does not run at all for anyone but
  # Dependabot.
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' && github.repository == 'mortennordbye/reelsmith'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # For a grouped PR, update-type is the largest bump in the group, so a
      # group that happens to contain a major is correctly held back rather
      # than waved through on the strength of the patches next to it.
      - name: Decide
        id: decide
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          ALERT_STATE: ${{ steps.meta.outputs.alert-state }}
        run: |
          if [ "$ALERT_STATE" = "OPEN" ]; then
            echo "reason=security advisory" >> "$GITHUB_OUTPUT"
            echo "merge=true" >> "$GITHUB_OUTPUT"
          elif [ "$UPDATE_TYPE" = "version-update:semver-patch" ] \
            || [ "$UPDATE_TYPE" = "version-update:semver-minor" ]; then
            echo "reason=routine ${UPDATE_TYPE##*:}" >> "$GITHUB_OUTPUT"
            echo "merge=true" >> "$GITHUB_OUTPUT"
          else
            echo "reason=${UPDATE_TYPE:-unknown} needs review" >> "$GITHUB_OUTPUT"
            echo "merge=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable auto-merge
        if: steps.decide.outputs.merge == 'true'
        run: |
          gh pr merge --auto --squash "$PR_URL"
          gh pr comment "$PR_URL" --body \
            "Auto-merge enabled (${{ steps.decide.outputs.reason }}). This merges itself once the required checks pass."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Flag for review
        if: steps.decide.outputs.merge != 'true'
        run: |
          gh pr edit "$PR_URL" --add-label "needs-review"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
