# Tests and lint for everything in the repo. The gateway image is built by
# build-gateway.yml instead, which is path-filtered, because a commit that only
# touches the pipeline must not produce a new image tag: Kargo would see it as
# new Freight and open a deploy PR for a byte-identical container.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: pytest + ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # pyproject pins >=3.14,<3.15, so let uv resolve it rather than pinning a
      # patch version here that drifts from what runs on the Mac.
      - name: Set up Python
        run: uv python install 3.14

      # The pipeline's own deps carry playwright, faster-whisper and the Kokoro
      # runtime. None of them are needed to run the suite, which is pure logic by
      # design, but the modules are imported, so they have to resolve.
      - name: Install dependencies
        run: |
          uv venv --python 3.14
          uv pip install -r requirements.txt
          uv pip install -e ".[dev,gateway]"

      - name: Ruff
        run: uv run ruff check

      - name: Tests
        run: uv run pytest

  # The video package had no CI at all, so a Remotion or TypeScript bump landed
  # unverified until someone rendered by hand. Both steps here are cheap and
  # they catch different things.
  video:
    name: video typecheck + bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # The active LTS. package.json says >=22 because 20 went end of life
          # in April 2026.
          node-version: 24
          cache: npm
          cache-dependency-path: video/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # `tsc` is not enough on its own. TypeScript 7 typechecks this project
      # cleanly and still breaks Remotion, because the bundler's esbuild loader
      # reads `typescript.sys`, which the native port does not expose. Bundling
      # is what surfaces that, it needs no browser, and it takes ~4 seconds.
      - name: Bundle
        run: npx remotion bundle
