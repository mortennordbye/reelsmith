# Builds and publishes the DM gateway image.
#
# Path-filtered on purpose. The image contains only `gateway/`, so a commit that
# touches the pipeline produces an identical container, and publishing it would
# create new Kargo Freight and an automatic deploy PR for a no-op change.
#
# Kargo promotes what this pushes. It selects on the `0.0.<run_number>` tag,
# because SHA tags have no ordering a registry watcher can sort. See
# homelab docs/kargo.md, "Onboard another app -> B. External-repo, single-env".
name: Build gateway image

on:
  push:
    branches: [main]
    paths:
      - "gateway/**"
      - ".dockerignore"
      - ".github/workflows/build-gateway.yml"
  pull_request:
    paths:
      - "gateway/**"
      - ".dockerignore"
      - ".github/workflows/build-gateway.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-gateway-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Not `github.repository`: the repo holds the pipeline as well, and the image
  # is only the gateway.
  IMAGE_NAME: ${{ github.repository }}-gateway

jobs:
  verify:
    name: Gateway tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv --python 3.14
          uv pip install -r requirements.txt
          uv pip install -e ".[dev,gateway]"

      - name: Gateway suite
        run: uv run pytest tests/ -k gateway

  build:
    name: Build and push
    runs-on: ubuntu-latest
    # A red suite must never publish an image Kargo would then try to promote.
    needs: verify
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The docker-container driver is required for the GHA cache backend.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            # The monotonic tag the Kargo Warehouse selects on.
            type=raw,value=0.0.${{ github.run_number }},enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          # Root context, because the Dockerfile reads gateway/requirements.txt
          # before gateway/. `.dockerignore` is a whitelist, so what actually
          # travels is ~1 kB rather than the checkout.
          context: .
          file: gateway/Dockerfile
          # PRs build to catch Dockerfile breakage but never push.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  prune:
    name: Prune old images
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      packages: write
    steps:
      # Every push leaves an untagged manifest behind once `latest` moves. They
      # are invisible in the UI and they accumulate. Free while the repo is
      # public, but an unbounded list is still a mess to read.
      - name: Delete untagged versions
        uses: actions/delete-package-versions@v5
        with:
          owner: ${{ github.repository_owner }}
          package-name: reelsmith-gateway
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 20
