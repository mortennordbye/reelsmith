<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}The Nightly Build{% endblock %}</title>
<style>
  /* Self-contained on purpose. These pages are read by people who arrived from
     a platform's app listing, on unknown devices, and they must render with no
     network beyond the HTML itself. */
  :root {
    --bg: #ffffff; --fg: #1c1e21; --muted: #5b616e;
    --rule: #e3e5e8; --link: #1a5fb4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --fg: #e6e8eb; --muted: #9aa1ac;
      --rule: #2a2e35; --link: #7cb0f0;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2.5rem 1.25rem 5rem;
    background: var(--bg); color: var(--fg);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 42rem; margin: 0 auto; }
  h1 { font-size: 1.75rem; line-height: 1.25; margin: 0 0 .35rem; }
  h2 { font-size: 1.15rem; margin: 2.25rem 0 .6rem; }
  p, li { color: var(--fg); }
  a { color: var(--link); }
  .dateline { color: var(--muted); font-size: .9rem; margin: 0 0 2rem; }
  .lede { font-size: 1.05rem; }
  table { border-collapse: collapse; width: 100%; margin: 1rem 0; font-size: .95rem; }
  th, td { text-align: left; vertical-align: top; padding: .5rem .6rem; border-bottom: 1px solid var(--rule); }
  th { color: var(--muted); font-weight: 600; }
  /* A narrow screen must scroll the table rather than the page. */
  .scroll { overflow-x: auto; }
  footer {
    max-width: 42rem; margin: 3.5rem auto 0; padding-top: 1.25rem;
    border-top: 1px solid var(--rule); color: var(--muted); font-size: .9rem;
  }
  footer a { margin-right: 1rem; }
</style>
</head>
<body>
<main>
{% block content %}{% endblock %}
</main>
<footer>
  <a href="/">The Nightly Build</a>
  <a href="/privacy">Privacy</a>
  <a href="/terms">Terms</a>
  <a href="https://github.com/mortennordbye/reelsmith">Source</a>
</footer>
</body>
</html>
